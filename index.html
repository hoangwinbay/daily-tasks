<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#667eea">
    <title>Cong Viec Ngau Nhien</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
        body { 
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:linear-gradient(180deg,#667eea 0%,#764ba2 100%);
            min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
            padding:0; margin:0;
        }
        .container {
            background:white; border-radius:20px 20px 0 0;
            box-shadow:0 -10px 40px rgba(0,0,0,0.2); padding:20px 15px 30px;
            max-width:500px; width:100%; min-height:100vh;
        }
        .header {
            background:linear-gradient(135deg,#667eea,#764ba2);
            margin:-20px -15px 20px; padding:25px 20px;
            color:white; text-align:center; border-radius:0 0 20px 20px;
        }
        .header h1 { font-size:22px; margin-bottom:8px; }
        .time-display { font-size:44px; font-weight:300; letter-spacing:2px; }
        .date-display { font-size:15px; opacity:0.9; margin-top:5px; }
        
        .tabs { display:flex; background:#f0f0f5; border-radius:12px; padding:4px; margin-bottom:20px; }
        .tab {
            flex:1; padding:14px 8px; text-align:center; border-radius:10px;
            font-size:15px; font-weight:600; color:#666; cursor:pointer;
            border:none; background:none; -webkit-appearance:none; touch-action:manipulation;
        }
        .tab.active { background:white; color:#667eea; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
        
        .tab-content { display:none; }
        .tab-content.active { display:block; }
        
        .input-group { display:flex; gap:8px; margin-bottom:12px; align-items:center; flex-wrap:wrap; }
        input[type="text"], select, textarea {
            padding:14px 16px; border:2px solid #e0e0e0; border-radius:12px;
            font-size:16px; outline:none; -webkit-appearance:none;
            background:white; color:#333;
        }
        input[type="text"] { flex:1; min-height:48px; min-width:120px; }
        select { min-height:48px; padding-right:32px; }
        textarea { width:100%; min-height:100px; font-family:inherit; resize:vertical; }
        
        .btn {
            padding:14px 18px; border-radius:12px; font-size:14px; font-weight:600;
            color:white; border:none; min-height:48px; cursor:pointer;
            display:inline-flex; align-items:center; justify-content:center; gap:5px;
            -webkit-appearance:none; touch-action:manipulation;
        }
        .btn:active { opacity:0.7; }
        .btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); }
        .btn-success { background:#4caf50; }
        .btn-danger { background:#ff6b6b; }
        .btn-info { background:linear-gradient(135deg,#4facfe,#00f2fe); }
        .btn-warning { background:linear-gradient(135deg,#fa709a,#fee140); }
        .btn-block { width:100%; display:flex; margin-bottom:10px; }
        .btn-small { padding:8px 14px; font-size:12px; min-height:36px; border-radius:8px; }
        .btn-icon { width:36px; height:36px; min-height:36px; padding:0; border-radius:50%; font-size:18px; }
        
        .task-list-box { background:#f8f9fa; border-radius:12px; padding:15px; margin:15px 0; }
        .task-list-box h3 { font-size:16px; margin-bottom:12px; color:#333; }
        .task-list { list-style:none; max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch; }
        .task-item {
            background:white; padding:12px; margin-bottom:8px; border-radius:10px;
            border-left:4px solid #667eea; display:flex; flex-wrap:wrap;
            gap:8px; align-items:center; justify-content:space-between;
            transition:all 0.3s;
        }
        .task-item.disabled { border-left-color:#ccc; opacity:0.5; }
        .task-item.done { border-left-color:#4caf50; background:#f0fff0; }
        .task-info { display:flex; align-items:center; gap:8px; flex:1; min-width:0; }
        .task-num { background:#667eea; color:white; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0; }
        .task-name { font-size:15px; color:#333; word-break:break-word; }
        .task-name.done-text { text-decoration:line-through; color:#999; }
        .task-tags { display:flex; gap:4px; flex-wrap:wrap; width:100%; }
        .tag { padding:3px 8px; border-radius:8px; font-size:11px; font-weight:600; }
        .tag-freq { background:#e3f2fd; color:#1976d2; }
        .tag-ok { background:#c8e6c9; color:#2e7d32; }
        .tag-no { background:#ffcdd2; color:#c62828; }
        .tag-date { background:#f5f5f5; color:#666; }
        .tag-done { background:#c8e6c9; color:#2e7d32; }
        
        /* Checkbox style */
        .checkbox-wrapper {
            display:flex; align-items:center; gap:8px; cursor:pointer;
            padding:8px; border-radius:8px; transition:all 0.2s;
        }
        .checkbox-wrapper:active { background:#f0f0f0; }
        .custom-checkbox {
            width:28px; height:28px; border:3px solid #ccc; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:18px; color:white; transition:all 0.2s;
            flex-shrink:0; background:white;
        }
        .custom-checkbox.checked {
            background:#4caf50; border-color:#4caf50; color:white;
        }
        
        .msg { padding:10px 14px; border-radius:10px; font-size:13px; text-align:center; margin:10px 0; display:none; }
        .msg.show { display:block; }
        .msg-error { background:#ffebee; color:#c62828; }
        .msg-success { background:#e8f5e9; color:#2e7d32; }
        
        .result-box { background:linear-gradient(135deg,#f5f7fa,#c3cfe2); border-radius:12px; padding:15px; margin-top:15px; }
        .result-box h3 { text-align:center; margin-bottom:12px; }
        .result-item {
            background:white; padding:12px 14px; margin-bottom:6px; border-radius:8px;
            display:flex; align-items:center; gap:10px; font-size:14px;
            transition:all 0.3s;
        }
        .result-item.done { background:#e8f5e9; opacity:0.7; }
        .result-item .task-name.done-text { text-decoration:line-through; color:#999; }
        .priority-tag { margin-left:auto; padding:3px 10px; border-radius:10px; font-size:11px; font-weight:600; color:white; }
        .pri-high { background:#ff6b6b; }
        .pri-med { background:#ffd93d; color:#333; }
        .pri-low { background:#6bcf7f; }
        
        .progress-bar {
            height:6px; background:#e0e0e0; border-radius:3px; margin:10px 0; overflow:hidden;
        }
        .progress-fill { height:100%; background:#4caf50; border-radius:3px; transition:width 0.3s; }
        .progress-text { text-align:center; font-size:13px; color:#666; margin-bottom:10px; }
        
        .hist-item { background:white; padding:12px 14px; margin-bottom:8px; border-radius:8px; }
        .hist-date { font-weight:600; color:#667eea; margin-bottom:4px; font-size:14px; }
        .hist-tasks { font-size:13px; color:#333; }
        
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .container { padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 Công Việc Ngẫu Nhiên</h1>
            <div class="time-display" id="timeDisplay">--:--</div>
            <div class="date-display" id="dateDisplay">----</div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="openTab('manage')">📝 Việc</button>
            <button class="tab" onclick="openTab('random')">🎲 Xáo</button>
            <button class="tab" onclick="openTab('history')">📅 Sử</button>
        </div>

        <!-- Tab Quản lý -->
        <div id="tab-manage" class="tab-content active">
            <div class="input-group">
                <input type="text" id="taskNameInput" placeholder="Nhập công việc..." autocomplete="off">
            </div>
            <div class="input-group">
                <select id="freqSelect">
                    <option value="daily">Hàng ngày</option>
                    <option value="2days">2 ngày/lần</option>
                    <option value="3days">3 ngày/lần</option>
                    <option value="weekly" selected>1 tuần/lần</option>
                    <option value="biweekly">2 tuần/lần</option>
                    <option value="monthly">1 tháng/lần</option>
                </select>
                <button class="btn btn-primary" onclick="addOneTask()">➕ Thêm</button>
            </div>

            <button class="btn btn-info btn-block" onclick="toggleBatch()">
                <span id="batchIcon">📝</span> <span id="batchLabel">Nhập Hàng Loạt</span>
            </button>

            <div id="batchSection" style="display:none;">
                <textarea id="batchInput" placeholder="Mỗi dòng 1 việc: Tên | tần suất"></textarea>
                <div class="input-group" style="margin-top:10px;">
                    <button class="btn btn-info" onclick="addBatchTasks()">✅ Thêm</button>
                    <button class="btn btn-warning" onclick="loadSamples()">🎯 Mẫu</button>
                </div>
            </div>

            <div id="msgManageError" class="msg msg-error"></div>
            <div id="msgManageOk" class="msg msg-success"></div>

            <div class="task-list-box">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <h3>📋 Danh sách</h3>
                    <button class="btn btn-small btn-info" onclick="exportData()">💾 Xuất</button>
                </div>
                <ul class="task-list" id="taskListEl"></ul>
                <div style="text-align:center;color:#666;font-size:13px;margin-top:8px;" id="taskCountEl">Chưa có công việc</div>
            </div>

            <div class="input-group">
                <button class="btn btn-small" style="background:#2196F3;" onclick="clickImport()">📥 Nhập</button>
                <button class="btn btn-small btn-danger" onclick="clearAll()">🗑️ Xóa hết</button>
            </div>
        </div>

        <!-- Tab Xáo trộn -->
        <div id="tab-random" class="tab-content">
            <div id="msgRandomError" class="msg msg-error"></div>
            <div id="msgRandomOk" class="msg msg-success"></div>
            
            <div style="text-align:center;margin:15px 0;">
                <button class="btn btn-primary" style="font-size:18px;padding:18px 30px;" onclick="doShuffle()">
                    🎲 Xáo Trộn Ngẫu Nhiên
                </button>
                <div style="color:#666;font-size:13px;margin-top:8px;">
                    Chỉ xáo việc có sẵn hôm nay
                </div>
            </div>

            <div class="result-box" id="resultBox">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                    <h3 style="margin:0;">✨ Thứ Tự Hôm Nay</h3>
                    <button class="btn btn-small btn-danger" onclick="resetShuffle()">🔄 Làm mới</button>
                </div>
                <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
                <div class="progress-text" id="progressText">Hoàn thành: 0/0</div>
                <ul class="result-list" id="resultList"></ul>
            </div>
        </div>

        <!-- Tab Lịch sử -->
        <div id="tab-history" class="tab-content">
            <h3 style="margin-bottom:15px;">📅 Lịch sử thực hiện</h3>
            <div id="historySection">
                <div style="text-align:center;color:#888;">Chưa có lịch sử</div>
            </div>
            <button class="btn btn-small btn-danger" style="margin-top:10px;" onclick="clearHistory()">🗑️ Xóa lịch sử</button>
        </div>

        <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="handleImport(event)">
    </div>

    <script>
        // ============ DATA LAYERS ============
        // 1. tasks: danh sách gốc (lưu localStorage)
        // 2. todayTasks: danh sách đã xáo hôm nay (lưu localStorage)
        // 3. completedTasks: danh sách ID đã hoàn thành hôm nay (lưu localStorage)
        // 4. history: lịch sử các ngày
        
        var tasks = [];
        var todayTasks = []; // { id, name, frequency, order }
        var completedToday = []; // [id1, id2, ...]
        var history = [];

        var freqMap = {
            'daily': 1, '2days': 2, '3days': 3,
            'weekly': 7, 'biweekly': 14, 'monthly': 30
        };
        var freqLabels = {
            'daily': 'Hàng ngày', '2days': '2 ngày', '3days': '3 ngày',
            'weekly': '1 tuần', 'biweekly': '2 tuần', 'monthly': '1 tháng'
        };

        // ============ CLOCK ============
        function updateClock() {
            var now = new Date();
            var h = now.getHours().toString().padStart(2, '0');
            var m = now.getMinutes().toString().padStart(2, '0');
            var s = now.getSeconds().toString().padStart(2, '0');
            var weekdays = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
            var d = now.getDate().toString().padStart(2, '0');
            var mo = (now.getMonth()+1).toString().padStart(2, '0');
            var y = now.getFullYear();
            
            document.getElementById('timeDisplay').textContent = h + ':' + m + ':' + s;
            document.getElementById('dateDisplay').textContent = weekdays[now.getDay()] + ', ' + d + '/' + mo + '/' + y;
        }

        // ============ STORAGE ============
        function loadAll() {
            var t = localStorage.getItem('taskmgr_tasks');
            var tt = localStorage.getItem('taskmgr_todayTasks');
            var ct = localStorage.getItem('taskmgr_completedToday');
            var td = localStorage.getItem('taskmgr_todayDate');
            var h = localStorage.getItem('taskmgr_history');
            
            if (t) { try { tasks = JSON.parse(t); } catch(e) { tasks = []; } }
            if (h) { try { history = JSON.parse(h); } catch(e) { history = []; } }
            
            // Kiểm tra xem todayTasks có phải của hôm nay không
            var todayStr = new Date().toDateString();
            if (td === todayStr && tt) {
                try { todayTasks = JSON.parse(tt); } catch(e) { todayTasks = []; }
                if (ct) { try { completedToday = JSON.parse(ct); } catch(e) { completedToday = []; } }
            } else {
                // Sang ngày mới -> reset
                todayTasks = [];
                completedToday = [];
                localStorage.setItem('taskmgr_todayDate', todayStr);
                localStorage.setItem('taskmgr_todayTasks', JSON.stringify(todayTasks));
                localStorage.setItem('taskmgr_completedToday', JSON.stringify(completedToday));
            }
        }

        function saveAll() {
            localStorage.setItem('taskmgr_tasks', JSON.stringify(tasks));
            localStorage.setItem('taskmgr_history', JSON.stringify(history));
        }

        function saveToday() {
            var todayStr = new Date().toDateString();
            localStorage.setItem('taskmgr_todayDate', todayStr);
            localStorage.setItem('taskmgr_todayTasks', JSON.stringify(todayTasks));
            localStorage.setItem('taskmgr_completedToday', JSON.stringify(completedToday));
        }

        // ============ TASK LOGIC ============
        function canDoTask(task) {
            if (!task.lastDone) return true;
            var last = new Date(task.lastDone);
            var today = new Date();
            last.setHours(0,0,0,0);
            today.setHours(0,0,0,0);
            var days = Math.floor((today - last) / 86400000);
            return days >= (freqMap[task.frequency] || 7);
        }

        function nextDateStr(task) {
            if (!task.lastDone) return 'Có thể làm';
            var last = new Date(task.lastDone);
            var days = freqMap[task.frequency] || 7;
            var next = new Date(last);
            next.setDate(next.getDate() + days);
            var today = new Date();
            today.setHours(0,0,0,0);
            if (next <= today) return 'Có thể làm';
            return next.toLocaleDateString('vi-VN');
        }

        // ============ ACTIONS ============
        function addOneTask() {
            var name = document.getElementById('taskNameInput').value.trim();
            var freq = document.getElementById('freqSelect').value;
            if (!name) { showMsg('msgManageError', 'Nhập tên!'); return; }
            if (tasks.some(function(t) { return t.name === name; })) {
                showMsg('msgManageError', 'Đã tồn tại!'); return;
            }
            tasks.push({
                id: Date.now(), name: name, frequency: freq,
                lastDone: null, createdAt: new Date().toISOString()
            });
            saveAll();
            renderTasks();
            document.getElementById('taskNameInput').value = '';
            showMsg('msgManageOk', 'Đã thêm!');
        }

        function toggleBatch() {
            var sec = document.getElementById('batchSection');
            if (sec.style.display === 'none') {
                sec.style.display = 'block';
                document.getElementById('batchIcon').textContent = '📋';
                document.getElementById('batchLabel').textContent = 'Ẩn';
            } else {
                sec.style.display = 'none';
                document.getElementById('batchIcon').textContent = '📝';
                document.getElementById('batchLabel').textContent = 'Nhập Hàng Loạt';
            }
        }

        function addBatchTasks() {
            var text = document.getElementById('batchInput').value.trim();
            if (!text) { showMsg('msgManageError', 'Nhập ít nhất 1 việc!'); return; }
            var lines = text.split('\n').filter(function(l) { return l.trim(); });
            var added = 0;
            lines.forEach(function(line) {
                var parts = line.split('|').map(function(p) { return p.trim(); });
                var name = parts[0];
                var freq = parts[1] || 'weekly';
                if (!name || tasks.some(function(t) { return t.name === name; }) || !freqMap[freq]) return;
                tasks.push({
                    id: Date.now() + Math.random(), name: name, frequency: freq,
                    lastDone: null, createdAt: new Date().toISOString()
                });
                added++;
            });
            saveAll();
            renderTasks();
            document.getElementById('batchInput').value = '';
            showMsg('msgManageOk', 'Thêm ' + added + ' việc!');
        }

        function loadSamples() {
            var samples = [
                {name:'Đi chợ', frequency:'2days'}, {name:'Lau nhà', frequency:'weekly'},
                {name:'Học tiếng Anh', frequency:'daily'}, {name:'Tập thể dục', frequency:'daily'},
                {name:'Dọn dẹp', frequency:'weekly'}, {name:'Đọc sách', frequency:'daily'},
                {name:'Gọi gia đình', frequency:'3days'}, {name:'Giặt đồ', frequency:'2days'},
                {name:'Nấu ăn', frequency:'daily'}, {name:'Thiền', frequency:'daily'}
            ];
            var added = 0;
            samples.forEach(function(s) {
                if (!tasks.some(function(t) { return t.name === s.name; })) {
                    tasks.push({
                        id: Date.now() + Math.random(), name: s.name,
                        frequency: s.frequency, lastDone: null,
                        createdAt: new Date().toISOString()
                    });
                    added++;
                }
            });
            if (added === 0) { showMsg('msgManageError', 'Đã có hết!'); return; }
            saveAll(); renderTasks();
            showMsg('msgManageOk', 'Thêm ' + added + ' việc!');
        }

        // ============ SHUFFLE & TODAY MANAGEMENT ============
        function doShuffle() {
            var available = tasks.filter(function(t) { return canDoTask(t); });
            if (available.length === 0) { showMsg('msgRandomError', 'Không có việc nào!'); return; }
            if (available.length < 2) { showMsg('msgRandomError', 'Cần ít nhất 2 việc!'); return; }
            
            // Tạo danh sách xáo trộn
            var shuffled = available.slice();
            for (var i = shuffled.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var temp = shuffled[i];
                shuffled[i] = shuffled[j];
                shuffled[j] = temp;
            }
            
            // Lưu vào todayTasks
            todayTasks = shuffled.map(function(t, idx) {
                return { id: t.id, name: t.name, frequency: t.frequency, order: idx };
            });
            completedToday = [];
            saveToday();
            
            renderTodayTasks();
            showMsg('msgRandomOk', 'Đã xáo ' + todayTasks.length + ' việc! Lưu đến hết ngày.');
        }

        function resetShuffle() {
            if (confirm('Tạo danh sách xáo trộn mới? Các việc đã tick sẽ mất.')) {
                doShuffle();
            }
        }

        function toggleComplete(taskId) {
            var idx = completedToday.indexOf(taskId);
            if (idx === -1) {
                // Chưa hoàn thành -> thêm vào
                completedToday.push(taskId);
            } else {
                // Đã hoàn thành -> bỏ tick
                completedToday.splice(idx, 1);
            }
            saveToday();
            renderTodayTasks();
            
            // Kiểm tra nếu tất cả đã hoàn thành
            if (completedToday.length === todayTasks.length && todayTasks.length > 0) {
                showMsg('msgRandomOk', '🎉 Hoàn thành tất cả công việc!');
            }
        }

        function saveCompletedToHistory() {
            // Lưu các việc đã hoàn thành vào tasks gốc và history
            var doneNames = [];
            var today = new Date().toISOString();
            
            completedToday.forEach(function(taskId) {
                var task = tasks.find(function(t) { return t.id === taskId; });
                if (task) {
                    task.lastDone = today;
                    doneNames.push(task.name);
                }
            });
            
            if (doneNames.length > 0) {
                history.unshift({ date: today, tasks: doneNames });
                if (history.length > 50) history = history.slice(0, 50);
                saveAll();
                renderTasks();
                renderHistory();
            }
        }

        // ============ RENDER ============
        function renderTasks() {
            var el = document.getElementById('taskListEl');
            var countEl = document.getElementById('taskCountEl');
            
            if (tasks.length === 0) {
                el.innerHTML = '';
                countEl.textContent = 'Chưa có công việc';
                return;
            }
            
            el.innerHTML = tasks.map(function(t, i) {
                var ok = canDoTask(t);
                var lastStr = t.lastDone ? new Date(t.lastDone).toLocaleDateString('vi-VN') : 'Chưa làm';
                var nextStr = !ok ? ' | Mở: ' + nextDateStr(t) : '';
                
                return '<li class="task-item' + (!ok ? ' disabled' : '') + '">' +
                    '<div class="task-info">' +
                        '<span class="task-num">' + (i+1) + '</span>' +
                        '<span class="task-name">' + t.name + '</span>' +
                    '</div>' +
                    '<div class="task-tags">' +
                        '<span class="tag tag-freq">' + (freqLabels[t.frequency]||t.frequency) + '</span>' +
                        '<span class="tag ' + (ok ? 'tag-ok' : 'tag-no') + '">' + (ok ? '✓' : '✗') + '</span>' +
                        '<span class="tag tag-date">' + lastStr + nextStr + '</span>' +
                    '</div>' +
                    '<div>' +
                        '<button class="btn btn-icon" style="background:#4caf50;" onclick="editTask(' + t.id + ')">✎</button>' +
                        '<button class="btn btn-icon" style="background:#ff6b6b;margin-left:4px;" onclick="deleteTask(' + t.id + ')">×</button>' +
                    '</div>' +
                '</li>';
            }).join('');
            
            var avail = tasks.filter(function(t) { return canDoTask(t); }).length;
            countEl.textContent = 'Tổng: ' + tasks.length + ' | Sẵn sàng: ' + avail;
        }

        function renderTodayTasks() {
            var box = document.getElementById('resultBox');
            var list = document.getElementById('resultList');
            var fill = document.getElementById('progressFill');
            var text = document.getElementById('progressText');
            
            if (todayTasks.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:#888;padding:20px;">Chưa có danh sách xáo trộn.<br>Nhấn nút Xáo Trộn để tạo!</div>';
                fill.style.width = '0%';
                text.textContent = 'Hoàn thành: 0/0';
                box.style.display = 'block';
                return;
            }
            
            box.style.display = 'block';
            
            var doneCount = completedToday.length;
            var total = todayTasks.length;
            var percent = Math.round((doneCount / total) * 100);
            
            fill.style.width = percent + '%';
            text.textContent = 'Hoàn thành: ' + doneCount + '/' + total + ' (' + percent + '%)';
            
            list.innerHTML = todayTasks.map(function(t, i) {
                var isDone = completedToday.indexOf(t.id) !== -1;
                var pri = i < Math.ceil(total * 0.3) ? 'Cao' : (i < Math.ceil(total * 0.6) ? 'Vừa' : 'Thấp');
                var priCls = i < Math.ceil(total * 0.3) ? 'pri-high' : (i < Math.ceil(total * 0.6) ? 'pri-med' : 'pri-low');
                
                return '<li class="result-item' + (isDone ? ' done' : '') + '">' +
                    '<div class="checkbox-wrapper" onclick="toggleComplete(' + t.id + ')">' +
                        '<div class="custom-checkbox' + (isDone ? ' checked' : '') + '">' +
                            (isDone ? '✓' : '') +
                        '</div>' +
                    '</div>' +
                    '<span class="task-num">' + (i+1) + '</span>' +
                    '<span class="task-name' + (isDone ? ' done-text' : '') + '">' + t.name + '</span>' +
                    '<span class="priority-tag ' + priCls + '">' + pri + '</span>' +
                '</li>';
            }).join('');
            
            // Tự động lưu vào history khi tất cả hoàn thành
            if (doneCount === total && total > 0) {
                // Chỉ lưu 1 lần
                var allDoneKey = 'taskmgr_allDone_' + new Date().toDateString();
                if (!localStorage.getItem(allDoneKey)) {
                    saveCompletedToHistory();
                    localStorage.setItem(allDoneKey, '1');
                }
            }
        }

        function renderHistory() {
            var el = document.getElementById('historySection');
            if (history.length === 0) {
                el.innerHTML = '<div style="text-align:center;color:#888;">Chưa có lịch sử</div>';
                return;
            }
            el.innerHTML = history.map(function(h) {
                var d = new Date(h.date);
                var dateStr = d.toLocaleDateString('vi-VN', {weekday:'long', day:'2-digit', month:'2-digit', year:'numeric'});
                return '<div class="hist-item">' +
                    '<div class="hist-date">📅 ' + dateStr + '</div>' +
                    '<div class="hist-tasks">' + h.tasks.join(' → ') + '</div>' +
                '</div>';
            }).join('');
        }

        // ============ EDIT / DELETE ============
        function editTask(id) {
            var task = tasks.find(function(t) { return t.id === id; });
            if (!task) return;
            var newName = prompt('Tên công việc:', task.name);
            if (newName && newName.trim()) {
                var newFreq = prompt('Tần suất (daily/2days/3days/weekly/biweekly/monthly):', task.frequency);
                if (newFreq && freqMap[newFreq]) {
                    var idx = tasks.findIndex(function(t) { return t.id === id; });
                    if (idx !== -1) {
                        tasks[idx].name = newName.trim();
                        tasks[idx].frequency = newFreq;
                        saveAll(); renderTasks();
                        showMsg('msgManageOk', 'Đã sửa!');
                    }
                }
            }
        }

        function deleteTask(id) {
            if (confirm('Xóa công việc này?')) {
                tasks = tasks.filter(function(t) { return t.id !== id; });
                // Cũng xóa khỏi todayTasks nếu có
                todayTasks = todayTasks.filter(function(t) { return t.id !== id; });
                completedToday = completedToday.filter(function(tid) { return tid !== id; });
                saveAll(); saveToday();
                renderTasks(); renderTodayTasks();
                showMsg('msgManageOk', 'Đã xóa!');
            }
        }

        function clearAll() {
            if (tasks.length === 0) return;
            if (confirm('Xóa tất cả ' + tasks.length + ' việc?')) {
                tasks = []; todayTasks = []; completedToday = [];
                saveAll(); saveToday();
                renderTasks(); renderTodayTasks();
                showMsg('msgManageOk', 'Đã xóa hết!');
            }
        }

        function clearHistory() {
            if (history.length === 0) return;
            if (confirm('Xóa lịch sử?')) { history = []; saveAll(); renderHistory(); }
        }

        // ============ IMPORT / EXPORT ============
        function exportData() {
            var data = {
                tasks: tasks,
                todayTasks: todayTasks,
                completedToday: completedToday,
                history: history,
                exportDate: new Date().toISOString()
            };
            var blob = new Blob([JSON.stringify(data)], {type:'application/json'});
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'tasks-' + new Date().toISOString().split('T')[0] + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showMsg('msgManageOk', 'Đã xuất!');
        }

        function clickImport() {
            document.getElementById('importFileInput').click();
        }

        function handleImport(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    var data = JSON.parse(ev.target.result);
                    if (data.tasks && confirm('Nhập dữ liệu? Sẽ ghi đè.')) {
                        tasks = data.tasks;
                        todayTasks = data.todayTasks || [];
                        completedToday = data.completedToday || [];
                        history = data.history || [];
                        saveAll(); saveToday();
                        renderTasks(); renderTodayTasks(); renderHistory();
                        showMsg('msgManageOk', 'Đã nhập!');
                    }
                } catch(err) { showMsg('msgManageError', 'File lỗi!'); }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        // ============ UI ============
        function openTab(name) {
            var tabs = document.querySelectorAll('.tab');
            var contents = document.querySelectorAll('.tab-content');
            tabs.forEach(function(t) { t.classList.remove('active'); });
            contents.forEach(function(c) { c.classList.remove('active'); });
            var idx = {manage:0, random:1, history:2}[name];
            tabs[idx].classList.add('active');
            document.getElementById('tab-' + name).classList.add('active');
            
            if (name === 'random') renderTodayTasks();
            if (name === 'history') renderHistory();
        }

        function showMsg(id, msg) {
            var el = document.getElementById(id);
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._t);
            el._t = setTimeout(function() { el.classList.remove('show'); }, 2500);
        }

        // ============ INIT ============
        loadAll();
        renderTasks();
        renderTodayTasks();
        updateClock();
        setInterval(updateClock, 1000);

        document.getElementById('taskNameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); addOneTask(); }
        });

        // Tự động lưu completed tasks vào history khi tất cả hoàn thành
        setInterval(function() {
            if (todayTasks.length > 0 && completedToday.length === todayTasks.length) {
                var allDoneKey = 'taskmgr_allDone_' + new Date().toDateString();
                if (!localStorage.getItem(allDoneKey)) {
                    saveCompletedToHistory();
                    localStorage.setItem(allDoneKey, '1');
                }
            }
        }, 5000);
    </script>
</body>
</html>
